name: Monitor scheduler

on:
  push:
    branches: [main]
    paths: [".github/workflows/monitor-scheduler.yml"]
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: internet-hands-monitor-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint repository-scoped OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=internet-hands-monitor-scheduler")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Inspect scheduler identity and validity window
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, time
          segment = os.environ["OIDC_TOKEN"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))
          summary = {key: claims.get(key) for key in ("iss", "aud", "sub", "nbf", "exp")}
          summary["runner_epoch"] = int(time.time())
          print(json.dumps(summary))
          PY

      - name: Execute due monitors
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://opencrawl.top/api/internal/monitors/tick"

      - name: Check Internet Hands system health
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://opencrawl.top/api/internal/system/health?strict=true"

      - name: Deep capability resolution health
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 180 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://opencrawl.top/api/internal/system/health?deep=true&strict=true"

  deliver-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint repository-scoped OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=internet-hands-monitor-scheduler")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Deliver saved dataset notifications
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://opencrawl.top/api/internal/dataset-webhooks/tick"

  execute-crawls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint repository-scoped OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=internet-hands-monitor-scheduler")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Execute one durable crawl
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://opencrawl.top/api/internal/crawl-runs/tick"

  execute-capability-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint repository-scoped OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=internet-hands-monitor-scheduler")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Advance one durable capability run
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://opencrawl.top/api/internal/capability-runs/tick"
