name: Monitor scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: internet-hands-monitor-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint repository-scoped OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=internet-hands-monitor-scheduler")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Execute due monitors
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://web-scrapping-cli.vercel.app/api/internal/monitors/tick"

      - name: Check Internet Hands system health
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://web-scrapping-cli.vercel.app/api/internal/system/health?strict=true"

      - name: Deep capability resolution health
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 180 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://web-scrapping-cli.vercel.app/api/internal/system/health?deep=true&strict=true"
