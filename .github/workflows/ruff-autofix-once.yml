name: Ruff autofix once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[ruff-autofix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.8"
      - name: Apply safe Ruff fixes
        run: ruff check src tests --fix || true
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No safe fixes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "chore: apply Ruff safe fixes"
          git push origin HEAD:main
