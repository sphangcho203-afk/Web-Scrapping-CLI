name: Promote production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve existing Vercel credential
        id: token
        shell: bash
        env:
          TOKEN_1: ${{ secrets.VERCEL_TOKEN }}
          TOKEN_2: ${{ secrets.VERCEL_API_TOKEN }}
          TOKEN_3: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          TOKEN_4: ${{ secrets.INTERNET_HANDS_VERCEL_TOKEN }}
          TOKEN_5: ${{ secrets.VERCEL_CLI_TOKEN }}
          TOKEN_6: ${{ secrets.VERCEL_PROD_TOKEN }}
        run: |
          set -euo pipefail
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4" "$TOKEN_5" "$TOKEN_6"; do
            if [ -n "$candidate" ]; then
              echo "::add-mask::$candidate"
              echo "token=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No Vercel credential is stored in the checked GitHub secrets"
          exit 1

      - name: Promote verified staged deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest promote \
            web-scrapping-mqi21i8ec-stand-still.vercel.app \
            --yes \
            --scope stand-still \
            --token "$VERCEL_TOKEN"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://web-scrapping-cli.vercel.app/ >/dev/null
