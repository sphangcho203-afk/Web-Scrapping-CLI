name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_control_plane_render.py tests/test_frontend_collections.py
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: python -m compileall -q src
      - run: node --check web/app.js
      - run: node --check web/usage-intelligence.js
      - run: node --check web/monitor-lifecycle.js
      - run: pytest -q
  dataset-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencrawl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENCRAWL_TEST_DATASET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/opencrawl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_datasets.py tests/test_dataset_webhooks.py tests/test_crawl_runs.py tests/test_crawl_resume.py tests/test_crawl_sitemaps.py tests/test_content_monitors.py tests/test_usage_ledger.py tests/test_execution_budget_storage.py tests/test_run_envelope.py
