[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "internet-hands"
version = "0.3.0"
description = "Public internet intelligence fabric for collection, discovery, indexing, monitoring, and provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Internet Hands contributors" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "typer>=0.15.1,<1",
  "rich>=13.9.4,<15",
  "pydantic>=2.10.6,<3",
  "fastapi>=0.115.8,<1",
  "uvicorn>=0.34.0,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = [
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.25.3,<1",
  "ruff>=0.9.6,<1",
]

[project.scripts]
internet-hands = "internet_hands.cli:app"
ih = "internet_hands.cli:app"
ih-openapi = "internet_hands.openapi_cli:app"
ih-discover = "internet_hands.discovery_cli:app"
ih-social = "internet_hands.social_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/internet_hands"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
