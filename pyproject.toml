[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "internet-hands"
version = "0.5.0"
description = "Public internet intelligence fabric for collection, discovery, indexing, monitoring, isolated cloud-computer execution, and external tool orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Internet Hands contributors" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "typer>=0.15.1,<1",
  "rich>=13.9.4,<15",
  "pydantic>=2.10.6,<3",
  "fastapi>=0.115.8,<1",
  "uvicorn>=0.34.0,<1",
  "PyYAML>=6.0.2,<7",
  "psycopg[binary]>=3.2,<4",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
extraction = ["trafilatura>=2.2,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
parquet = ["pyarrow>=15,<24"]
crawlee = ["crawlee>=1,<2"]
crawl4ai = ["crawl4ai>=0.9.3,<1"]
scrapy = ["Scrapy>=2.12,<3"]
fleet = [
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
]
all-backends = [
  "playwright>=1.50,<2",
  "trafilatura>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "pyarrow>=15,<24",
  "crawlee>=1,<2",
  "crawl4ai>=0.9.3,<1",
  "Scrapy>=2.12,<3",
]
dev = [
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.25.3,<1",
  "ruff>=0.9.6,<1",
]

[project.scripts]
internet-hands = "internet_hands.cli:app"
ih = "internet_hands.cli:app"
ih-openapi = "internet_hands.openapi_cli:app"
ih-discover = "internet_hands.discovery_cli:app"
ih-social = "internet_hands.social_cli:app"
ih-data = "internet_hands.data_cli:app"
ih-media = "internet_hands.media_cli:app"
ih-search = "internet_hands.search_cli:app"
ih-backends = "internet_hands.backends_cli:app"
ih-hunt = "internet_hands.hunt_cli:app"
ih-fleet = "internet_hands.fleet_cli:app"
ih-worker = "internet_hands.worker_cli:app"
ih-fleet-api = "internet_hands.fleet_api:run"
ih-content = "internet_hands.content_cli:app"
ih-export = "internet_hands.export_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/internet_hands"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "app:app"
